<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Pay Order</h3>
    <p>Order ID: <strong th:text="${order.id}"></strong></p>
    <p>Author: <strong th:text="${order.author}"></strong></p>
    <p>Status: <strong th:text="${order.status}"></strong></p>

    <form th:action="@{/order/pay/{id}(id=${order.id})}" method="post">
        <div class="form-group">
            <label>Payment Method</label>
            <div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="method"
                           id="voucherCode" value="VOUCHER_CODE" checked>
                    <label class="form-check-label" for="voucherCode">Voucher Code</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="method"
                           id="cashOnDelivery" value="CASH_ON_DELIVERY">
                    <label class="form-check-label" for="cashOnDelivery">Cash on Delivery</label>
                </div>
            </div>
        </div>

        <div class="form-group mt-3">
            <label for="voucherCodeInput">Voucher Code</label>
            <input type="text" class="form-control col-6" id="voucherCodeInput"
                   name="voucherCode" placeholder="e.g. ESHOP1234ABC5678">
        </div>

        <div class="form-group mt-3">
            <label for="addressInput">Address</label>
            <input type="text" class="form-control col-6" id="addressInput"
                   name="address" placeholder="Enter delivery address">
        </div>

        <div class="form-group mt-3">
            <label for="deliveryFeeInput">Delivery Fee</label>
            <input type="text" class="form-control col-6" id="deliveryFeeInput"
                   name="deliveryFee" placeholder="Enter delivery fee">
        </div>

        <button type="submit" class="btn btn-primary mt-2">Submit Payment</button>
    </form>
</div>
</body>
</html>
