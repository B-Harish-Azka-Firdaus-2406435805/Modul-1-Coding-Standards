<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Payment Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Manage Payment</h3>
    <a href="/payment/admin/list" class="btn btn-secondary mb-3">Back to List</a>
    <table class="table table-bordered col-6">
        <tr>
            <th>Payment ID</th>
            <td th:text="${payment.id}"></td>
        </tr>
        <tr>
            <th>Method</th>
            <td th:text="${payment.method}"></td>
        </tr>
        <tr>
            <th>Status</th>
            <td th:text="${payment.status}"></td>
        </tr>
    </table>
    <div class="mt-3">
        <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post">
            <button type="submit" name="status" value="SUCCESS" class="btn btn-success mr-2">Accept</button>
            <button type="submit" name="status" value="REJECTED" class="btn btn-danger">Reject</button>
        </form>
    </div>
</div>
</body>
</html>
